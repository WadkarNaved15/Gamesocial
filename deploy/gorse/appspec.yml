version: 0.0
os: linux

files:
  - source: /docker-compose.yml
    destination: /home/ubuntu/gorse
  - source: /config.toml
    destination: /home/ubuntu/gorse
  - source: /scripts
    destination: /home/ubuntu/gorse

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: root

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: scripts/validate.sh 
      timeout: 300
      runas: root