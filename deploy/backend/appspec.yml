version: 0.0
os: linux

files:
  - source: /server
    destination: /home/ubuntu/Rigzer/server

  - source: /nginx
    destination: /home/ubuntu/Rigzer/nginx

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: root

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: scripts/validate.sh
      timeout: 300
      runas: root